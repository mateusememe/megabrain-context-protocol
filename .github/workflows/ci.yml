name: CI

on:
  push:
    paths:
      - "devbrain-mcp-repo/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "devbrain-mcp-repo/**"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devbrain-mcp-repo
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
