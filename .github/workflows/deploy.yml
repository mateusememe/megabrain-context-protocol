name: Deploy Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "devbrain-mcp-repo/src/**"
      - "devbrain-mcp-repo/Dockerfile"
      - "devbrain-mcp-repo/pyproject.toml"
      - "devbrain-mcp-repo/uv.lock"
      - ".github/workflows/deploy.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

env:
  SERVICE: devbrain-mcp
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/devbrain/devbrain-mcp:${{ github.sha }}

jobs:
  deploy:
    # Fica desligado até infrastructure/gcp/bootstrap.sh cadastrar as variables do repositório.
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devbrain-mcp-repo
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
      - run: docker build --tag "$IMAGE" .
      - run: docker push "$IMAGE"
      - name: Deploy no Cloud Run (privado por padrão)
        run: >-
          gcloud run deploy "$SERVICE"
          --project "${{ vars.GCP_PROJECT_ID }}"
          --region "${{ vars.GCP_REGION }}"
          --image "$IMAGE"
          --service-account "${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}"
          --port 8080
          --cpu 1
          --memory 512Mi
          --min-instances 0
          --max-instances 3
          --timeout 30
          --no-allow-unauthenticated
