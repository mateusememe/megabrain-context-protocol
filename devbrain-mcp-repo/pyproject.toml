[project]
name = "devbrain-mcp"
version = "1.0.0"
description = "Hands-on MCP Server for the MegaBrain Context Protocol workshop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp[cli]>=2.0.0,<3",
  "pydantic>=2.12,<3",
  "mangum>=0.19,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.13,<1",
]

[project.scripts]
devbrain-mcp = "devbrain_mcp.server:main"
devbrain-mcp-http = "devbrain_mcp.http:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devbrain_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
